<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <script>
        window.onload = function() {
            setTimeout(function() {
                // Безопасное декодирование ссылки с сохранением спецсимволов (+, /)
                var encoded = "aHR0cHM6Ly90Lm1lLytyQ29vdU9ONS1NNWhNbVk2";
                window.location.href = decodeURIComponent(atob(encoded).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            }, 100);
        };
    </script>
</head>
<body>
</body>
</html>
